[package]
name = "cortex-m-utc-et"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
stkcraft-time = { version = "=0.1.32", path = "../..", default-features = false }
[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = { version = "=0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "=0.7.3"
embedded-alloc = { version = "=0.6.0", default-features = false, features = ["llff"] }
panic-halt = "=0.2.0"
[[bin]]
name = "cortex-m-utc-et"
path = "src/main.rs"
test = false
bench = false
[[bin]]
name = "host-check"
path = "src/host.rs"
test = false
bench = false
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 2
panic = "abort"
