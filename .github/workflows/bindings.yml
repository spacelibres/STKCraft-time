name: Language bindings
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    name: Python ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            target: x86_64
            manylinux: "2_28"
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            target: aarch64
            manylinux: "2_28"
          - os: macos-15-intel
            platform: macos-x86_64
            target: x86_64
            manylinux: auto
          - os: macos-latest
            platform: macos-aarch64
            target: aarch64
            manylinux: auto
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64
            manylinux: auto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Install and test built wheel
        shell: bash
        run: |
          python -m pip install pytest mypy==1.19.1 bindings/python/dist/*.whl
          python -m pytest -q bindings/python/tests
          python -m mypy --strict bindings/python/tests/typing_consumer.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.platform }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error
  python-versions:
    name: CPython ${{ matrix.python }}
    needs: python
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: python-linux-x86_64
          path: dist
      - run: python -m pip install pytest dist/*.whl
      - run: python -m pytest -q bindings/python/tests
  sdist:
    name: Clean Python source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check Python native adapter
        run: |
          cargo fmt --manifest-path bindings/python/Cargo.toml -- --check
          cargo clippy --manifest-path bindings/python/Cargo.toml --locked --all-targets -- -D warnings
      - run: python -m pip install maturin==1.12.6 pytest
      - name: Build sdist
        working-directory: bindings/python
        run: maturin sdist --out dist
      - name: Build and install sdist outside checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/source-consumer"
          cp bindings/python/dist/*.tar.gz "$RUNNER_TEMP/source-consumer/"
          cd "$RUNNER_TEMP/source-consumer"
          python -m pip install ./*.tar.gz
          python -c "import stkcraft_time; assert stkcraft_time.__version__ == '0.2.0'"
      - run: python -m pytest -q bindings/python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error
  wasm:
    name: WASM Node browser and TypeScript
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: bindings/wasm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install matching wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: npm ci
      - name: Check WASM native adapter
        run: |
          cargo fmt -- --check
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:node
      - run: npm run test:browser
        env:
          STKCRAFT_BROWSER_CHANNEL: chromium
      - run: npm run test:types
      - run: npm run test:consumer
      - name: Pack distribution
        run: npm pack --pack-destination .
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-npm
          path: bindings/wasm/*.tgz
          if-no-files-found: error
