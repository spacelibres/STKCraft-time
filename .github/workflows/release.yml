name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            artifact: linux-x86_64
          - os: macos-15-intel
            platform: macos-x86_64
            artifact: macos
          - os: windows-latest
            platform: windows-x86_64
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries
        run: cargo build --locked --release --features mcp --bins
      - name: Build macOS arm64 binaries
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --locked --release --features mcp --bins --target aarch64-apple-darwin
      - name: Test release profile (Linux)
        if: runner.os == 'Linux'
        run: cargo test --locked --release --features mcp
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/stkcraft-mcp dist/
          cp target/release/sclk-check dist/
          cp target/release/ut1-check dist/
          cp target/release/tdb-compare dist/
          cp target/release/wgc-compare dist/
          cp README.md LICENSE CHANGELOG.md dist/
          tar -czf "stkcraft-time-${GITHUB_REF_NAME}-${{ matrix.platform }}.tar.gz" -C dist .
      - name: Package macOS arm64
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist-arm64
          cp target/aarch64-apple-darwin/release/stkcraft-mcp dist-arm64/
          cp target/aarch64-apple-darwin/release/sclk-check dist-arm64/
          cp target/aarch64-apple-darwin/release/ut1-check dist-arm64/
          cp target/aarch64-apple-darwin/release/tdb-compare dist-arm64/
          cp target/aarch64-apple-darwin/release/wgc-compare dist-arm64/
          cp README.md LICENSE CHANGELOG.md dist-arm64/
          tar -czf "stkcraft-time-${GITHUB_REF_NAME}-macos-aarch64.tar.gz" -C dist-arm64 .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/stkcraft-mcp.exe dist/
          Copy-Item target/release/sclk-check.exe dist/
          Copy-Item target/release/ut1-check.exe dist/
          Copy-Item target/release/tdb-compare.exe dist/
          Copy-Item target/release/wgc-compare.exe dist/
          Copy-Item README.md,LICENSE,CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath "stkcraft-time-$env:GITHUB_REF_NAME-${{ matrix.platform }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stkcraft-time-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: stkcraft-time ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: artifacts/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Read crate version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publish."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/stkcraft-time/$VERSION")
          if [ "$status" = "200" ]; then
            echo "stkcraft-time $VERSION is already published; nothing to do."
            exit 0
          fi
          cargo publish --locked
