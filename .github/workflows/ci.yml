name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown, thumbv7em-none-eabi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Run tests with MCP feature
        run: cargo test --locked --all-targets --features mcp
      - name: Test integration validator guards
        run: python3 -m unittest discover -s tools/tests -p test_geocalc_time.py -v
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Clippy with MCP feature
        run: cargo clippy --locked --all-targets --features mcp -- -D warnings
      - name: Build without default features
        run: cargo build --locked --no-default-features
      - name: Build wasm32 no_std
        run: cargo build --locked --no-default-features --target wasm32-unknown-unknown
      - name: Build thumbv7em no_std
        run: cargo build --locked --no-default-features --target thumbv7em-none-eabi
      - name: Build MCP server
        run: cargo build --locked --features mcp --bin stkcraft-mcp
      - name: Build docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features

  msrv:
    name: MSRV 1.75
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.75
        uses: dtolnay/rust-toolchain@1.75.0
      - name: Check MSRV
        run: cargo check --locked --all-targets --features mcp
