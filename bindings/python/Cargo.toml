[package]
name = "stkcraft-time-python"
version = "0.1.33"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Python bindings for the stkcraft-time astronomical time core"
repository = "https://github.com/spacelibres/STKCraft-time"
[workspace]
[lib]
name = "_native"
crate-type = ["cdylib"]
[dependencies]
stkcraft-time = { version = "=0.1.33", path = "../.." }
pyo3 = { version = "=0.29.0", features = ["extension-module", "abi3-py310"] }
