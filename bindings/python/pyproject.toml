[build-system]
requires = ["maturin==1.12.6"]
build-backend = "maturin"
[project]
name = "stkcraft-time"
version = "0.2.1"
requires-python = ">=3.10"
description = "Exact Rust-backed astronomical time scales and explicit NAIF/IAU models"
license = "MIT"
license-files = ["PYTHON-LICENSE", "CORE-ATTRIBUTION.md"]
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Rust"]
[tool.maturin]
python-source = "python"
module-name = "stkcraft_time._native"
include = ["python/stkcraft_time/py.typed", "python/stkcraft_time/*.pyi"]
