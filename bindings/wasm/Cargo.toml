[package]
name = "stkcraft-time-wasm"
version = "0.1.33"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Checked WebAssembly adapters for stkcraft-time"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stkcraft-time = { path = "../..", version = "=0.1.33" }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
serde_json = "=1.0.149"
