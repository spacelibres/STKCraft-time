[package]
name = "stkcraft-time"
version = "0.1.26"
edition = "2021"
rust-version = "1.75"
authors = ["STKCraft"]
description = "NAIF/SPICE-aligned astronomical time scales in Rust: UTC, TAI, TT, TDB/ET, GPS, UT1 and SCLK, with LSK/SCLK/EOP kernels, no_std support, WebGeocalc parity and an MCP server."
license = "MIT"
repository = "https://github.com/spacelibres/STKCraft-time"
homepage = "https://www.stkcraft.com"
documentation = "https://docs.rs/stkcraft-time"
readme = "README.md"
keywords = ["time", "spice", "naif", "astronomy", "utc"]
categories = ["aerospace", "date-and-time", "science", "no-std", "parsing"]

[dependencies]
libm = "0.2"
serde_json = { version = "1", optional = true }

[features]
default = ["std"]
std = []
mcp = ["std", "dep:serde_json"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[package.metadata.docs.rs]
all-features = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "wgc-compare"
path = "src/bin/wgc_compare.rs"
required-features = ["std"]

[[bin]]
name = "ut1-check"
path = "src/bin/ut1_check.rs"
required-features = ["std"]

[[bin]]
name = "tdb-compare"
path = "src/bin/tdb_compare.rs"
required-features = ["std"]

[[bin]]
name = "sclk-check"
path = "src/bin/sclk_check.rs"
required-features = ["std"]

[[bin]]
name = "stkcraft-mcp"
path = "src/bin/mcp_server.rs"
required-features = ["std", "mcp"]
