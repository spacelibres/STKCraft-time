[package]
name = "stkcraft-time"
version = "0.1.4"
edition = "2021"
rust-version = "1.75"
description = "NAIF/SPICE-aligned astronomical time scales for STKCraft"
license = "MIT"
repository = "https://github.com/spacelibres/STKCraft-time"
homepage = "https://www.stkcraft.com"
documentation = "https://docs.rs/stkcraft-time"
readme = "README.md"
keywords = ["time", "spice", "naif", "astronomy", "utc"]
categories = ["science", "no-std"]

[dependencies]
libm = "0.2"
serde_json = { version = "1", optional = true }

[features]
default = ["std"]
std = []
mcp = ["std", "dep:serde_json"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "wgc-compare"
path = "src/bin/wgc_compare.rs"
required-features = ["std"]

[[bin]]
name = "ut1-check"
path = "src/bin/ut1_check.rs"
required-features = ["std"]

[[bin]]
name = "tdb-compare"
path = "src/bin/tdb_compare.rs"
required-features = ["std"]

[[bin]]
name = "sclk-check"
path = "src/bin/sclk_check.rs"
required-features = ["std"]

[[bin]]
name = "stkcraft-mcp"
path = "src/bin/mcp_server.rs"
required-features = ["std", "mcp"]
